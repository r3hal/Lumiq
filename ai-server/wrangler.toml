name = "lumiq-ai"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Free Cloudflare Workers AI fallback: no API key needed.
[ai]
binding = "AI"

# Optional overrides (uncomment to change):
# [vars]
# GEMINI_MODELS = "gemini-flash-latest,gemma-4-26b-a4b-it,gemini-flash-lite-latest"
# GROQ_MODEL = "meta-llama/llama-4-scout-17b-16e-instruct"
# WORKERS_AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
#
# Secrets (never commit these):
#   npx wrangler secret put APP_TOKEN        # any long random string, also typed into the app
#   npx wrangler secret put GEMINI_API_KEY   # free key from https://aistudio.google.com/apikey
#   npx wrangler secret put GROQ_API_KEY     # optional, free key from https://console.groq.com/keys

# AI Shot learning (optional). Create the free database once:
#   npx wrangler d1 create lumiq-learning        # prints a database_id
#   npx wrangler d1 execute lumiq-learning --remote --file schema.sql
# then uncomment and paste the id:
# [[d1_databases]]
# binding = "DB"
# database_name = "lumiq-learning"
# database_id = "PASTE-ID-HERE"
