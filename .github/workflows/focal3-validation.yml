name: Focal 3 integration validation
on:
  push:
    branches: [codex/focal-3-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focal3-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          python3 -m venv /tmp/focal-test-env
          /tmp/focal-test-env/bin/pip install -r backup-server/requirements.txt PyYAML
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev
      - name: Structure and consent guards
        run: |
          /tmp/focal-test-env/bin/python scripts/validate_structure.py
          python3 scripts/validate_backup.py
          python3 scripts/validate_focal3.py
          node --check backup-server/focal_backup/folder.js
      - name: Public non-secret IPA policy
        run: python3 -m unittest discover -s scripts/tests -p test_public_ipa.py -v
      - name: Swift backup queue with mock transport
        run: python3 scripts/test_backup_portable.py
      - name: Backend and Google protocol fixtures (no external services)
        run: /tmp/focal-test-env/bin/python -m unittest discover -s backup-server/tests -v
        env:
          PYTHONPATH: backup-server
      - name: Existing AI, Gemini and Sony portable regressions
        run: |
          python3 scripts/test_framing_portable.py
          python3 scripts/test_sony_portable.py
          python3 -m unittest discover -s scripts/tests -p test_personal_cloud_ipa.py -v
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Xcode version and syntax
        run: |
          xcodebuild -version
          find Focal FocalTests -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - name: Native iOS XCTest suite
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project Focal.xcodeproj -scheme Focal -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath build/Focal3Tests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Unsigned iPhone archive
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          xcodebuild -project Focal.xcodeproj -scheme Focal -configuration Release -destination 'generic/platform=iOS' -archivePath build/Focal.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          test ! -f build/Focal.xcarchive/Products/Applications/Focal.app/CloudComposition.local.json
      - name: Public Release IPA packaging
        run: python3 scripts/package_public_ipa.py --app build/Focal.xcarchive/Products/Applications/Focal.app --output build/Focal-unsigned.ipa
      - name: Non-secret Debug iPhone archive and IPA
        run: |
          set -euo pipefail
          test ! -e LocalDeveloper/CloudComposition.local.json
          xcodebuild -project Focal.xcodeproj -scheme Focal -configuration Debug -destination 'generic/platform=iOS' -archivePath build/Focal-PublicDebug.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          python3 scripts/package_public_ipa.py --app build/Focal-PublicDebug.xcarchive/Products/Applications/Focal.app --output build/Focal-Debug-unsigned.ipa
      - name: Private Debug packaging with mock credential only
        run: env -u GEMINI_API_KEY python3 scripts/test_personal_cloud_native.py
  backend-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build backup-server
      - name: Validate HTTPS proxy configuration without starting service
        run: docker run --rm -e BACKUP_DOMAIN=backup.example -v "$PWD/backup-server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
