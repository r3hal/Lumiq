# Upload the CONTENTS of the Focal folder to the root of your Git repository.
# For free personal installation, run ios-sideload. ios-check runs optional tests.
workflows:
  ios-sideload:
    name: Focal - unsigned IPA for free personal sideloading
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "16.4"
    scripts:
      - name: Build and run composition tests on a simulator
        script: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project Focal.xcodeproj -scheme Focal \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/FocalTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
      - name: Build native iPhone app without a distribution certificate
        script: |
          set -euo pipefail
          xcodebuild -project Focal.xcodeproj -scheme Focal \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Focal.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package unsigned app for AltStore Classic to sign
        script: |
          set -euo pipefail
          python3 scripts/package_public_ipa.py \
            --app build/Focal.xcarchive/Products/Applications/Focal.app \
            --output build/Focal-unsigned.ipa
    artifacts:
      - build/Focal-unsigned.ipa
      - build/FocalTests.xcresult

  ios-check:
    name: Focal - build and test (no Apple signing required)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "16.4"
    scripts:
      - name: Build and run composition tests on a simulator
        script: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project Focal.xcodeproj -scheme Focal \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/FocalTests.xcresult \
            CODE_SIGNING_ALLOWED=NO test
    artifacts:
      - build/FocalTests.xcresult


  ios-evaluation:
    name: Focal - developer intelligence evaluation IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "16.4"
    scripts:
      - name: Build and run composition tests on a simulator
        script: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project Focal.xcodeproj -scheme Focal \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/FocalTests.xcresult \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG FOCAL_EVALUATION' CODE_SIGNING_ALLOWED=NO test
      - name: Build native iPhone app without a distribution certificate
        script: |
          set -euo pipefail
          xcodebuild -project Focal.xcodeproj -scheme Focal \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Focal.xcarchive \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=FOCAL_EVALUATION CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package unsigned app for AltStore Classic to sign
        script: |
          set -euo pipefail
          python3 scripts/package_public_ipa.py \
            --app build/Focal.xcarchive/Products/Applications/Focal.app \
            --output build/Focal-unsigned.ipa
    artifacts:
      - build/Focal-unsigned.ipa
      - build/FocalTests.xcresult


  ios-debug-sideload:
    name: Focal - public Debug test IPA (no embedded credentials)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "16.4"
    scripts:
      - name: Verify public build policy
        script: |
          set -euo pipefail
          test ! -e LocalDeveloper/CloudComposition.local.json
          python3 -m unittest discover -s scripts/tests -p 'test_public_ipa.py' -v
      - name: Run native Debug regressions
        script: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project Focal.xcodeproj -scheme Focal -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/PublicDebugTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Archive non-secret Debug iPhone app
        script: |
          set -euo pipefail
          test ! -e LocalDeveloper/CloudComposition.local.json
          xcodebuild -project Focal.xcodeproj -scheme Focal -configuration Debug \
            -destination 'generic/platform=iOS' -archivePath build/Focal-PublicDebug.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Publish only a validated public Debug IPA
        script: |
          set -euo pipefail
          python3 scripts/package_public_ipa.py \
            --app build/Focal-PublicDebug.xcarchive/Products/Applications/Focal.app \
            --output build/Focal-Debug-unsigned.ipa
    artifacts:
      - build/Focal-Debug-unsigned.ipa
      - build/PublicDebugTests.xcresult


  # PERSONAL ONLY: select main + manual start + Enable SSH/VNC access. Never publish this IPA.
  # GEMINI_API_KEY must be Secret in the app-scoped focal_cloud_personal group.
  ios-cloud-personal:
    name: Focal - PRIVATE Debug Cloud Scan (SSH download only)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: "16.4"
      groups:
        - focal_cloud_personal
      vars:
        GEMINI_MODEL: gemini-3.8-flash
    # No triggering, cache or publishing section: this workflow is manual-only.
    scripts:
      - name: Validate private build tooling without exposing credentials
        script: |
          set +x
          set -euo pipefail
          env -u GEMINI_API_KEY python3 -m unittest discover -s scripts/tests -p 'test_personal_cloud_ipa.py' -v
      - name: Run native regressions before creating developer configuration
        script: |
          set +x
          set -euo pipefail
          test ! -e LocalDeveloper/CloudComposition.local.json
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          env -u GEMINI_API_KEY xcodebuild -project Focal.xcodeproj -scheme Focal \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath build/PersonalCloudTests.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Verify live project model, build private Debug IPA and await SSH download
        script: |
          set +x
          set -euo pipefail
          python3 scripts/build_personal_cloud_ipa.py build
    # No key-bearing IPA, app, archive, logs or test bundle goes into artifact storage.
